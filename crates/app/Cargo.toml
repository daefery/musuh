[package]
name = "musuh"
version.workspace = true
edition.workspace = true
license.workspace = true
description = "MUSUH: offline cyber exercise console. One binary: local web console + exercise engine + rapor verifier."

[dependencies]
musuh-engine = { path = "../engine" }
serde.workspace = true
serde_json.workspace = true
axum = "0.8"
tokio = { version = "1", features = ["rt-multi-thread", "macros", "net", "time", "sync", "signal"] }
tokio-stream = { version = "0.1", features = ["sync"] }
futures-util = "0.3"
rust-embed = "8"
mime_guess = "2"
